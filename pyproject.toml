[project]
name = "ipa"
version = "0.1.0"
description = "Intelligent Process Automation platform for documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # --- Web / API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Persistence ---
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "motor>=3.6",
    "redis>=5.2",
    "minio>=7.2",
    # --- Workers ---
    "celery[redis]>=5.4",
    # --- Providers ---
    "openai>=1.55",
    "httpx>=0.27",
    # --- Processing ---
    "pymupdf>=1.24",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    # --- Agent surface ---
    "mcp>=1.1",
    # --- Observability ---
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[project.optional-dependencies]
integration = ["testcontainers>=4.8"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pytz>=2024.2",
    "celery-types>=0.22",
    "fakeredis>=2.26",
    "mongomock-motor>=0.0.34",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "D",    # pydocstyle — docstrings are a project requirement
    "ANN",  # flake8-annotations
    "T20",  # flake8-print — structlog only, never print
    "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",  # explicit Any is required by several shared contracts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN201"]
"migrations/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ipa"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

# Untyped third-party libraries only.
[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pytesseract.*",
    "mongomock_motor.*",
    "minio.*",
    "pgvector.*",
    "opentelemetry.instrumentation.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: requires live infrastructure"]

[tool.coverage.run]
source = ["src/ipa"]
branch = true
