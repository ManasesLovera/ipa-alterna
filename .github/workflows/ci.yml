name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
            web:
              - 'apps/web/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Validate mermaid blocks
        run: |
          npm install -g @mermaid-js/mermaid-cli
          # Extract every ```mermaid block and verify it parses.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          failed = []
          for md in pathlib.Path(".").rglob("*.md"):
              if "node_modules" in md.parts:
                  continue
              blocks = re.findall(r"```mermaid\n(.*?)```", md.read_text(), re.S)
              for i, block in enumerate(blocks):
                  with tempfile.NamedTemporaryFile("w", suffix=".mmd", delete=False) as f:
                      f.write(block)
                      path = f.name
                  r = subprocess.run(["mmdc", "-i", path, "-o", path + ".svg"],
                                     capture_output=True, text=True)
                  if r.returncode != 0:
                      failed.append(f"{md}#block{i}: {r.stderr.strip()[:300]}")
          if failed:
              print("\n".join(failed)); sys.exit(1)
          print("all mermaid blocks parse")
          PY

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: ruff format --check
        run: uv run ruff format --check src tests scripts
      - name: mypy
        run: uv run mypy src

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: uv sync --all-extras --dev
      - name: pytest
        run: uv run pytest tests/unit -v --cov=src/ipa --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml

  migrations:
    name: Migrations up + down
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ipa
          POSTGRES_PASSWORD: ipa
          POSTGRES_DB: ipa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IPA_POSTGRES_DSN: postgresql+asyncpg://ipa:ipa@localhost:5432/ipa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: no pending autogenerate diff
        run: uv run alembic check
      - name: alembic downgrade base
        run: uv run alembic downgrade base

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [changes, unit]
    if: needs.changes.outputs.python == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ipa
          POSTGRES_PASSWORD: ipa
          POSTGRES_DB: ipa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: ipa-documents
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IPA_ENV: test
      IPA_POSTGRES_DSN: postgresql+asyncpg://ipa:ipa@localhost:5432/ipa
      IPA_MONGO_URI: mongodb://localhost:27017
      IPA_MONGO_DB: ipa_test
      IPA_REDIS_URL: redis://localhost:6379/0
      IPA_CELERY_BROKER_URL: redis://localhost:6379/1
      IPA_CELERY_RESULT_BACKEND: redis://localhost:6379/2
      IPA_S3_ENDPOINT: http://localhost:9000
      IPA_S3_ACCESS_KEY: minioadmin
      IPA_S3_SECRET_KEY: minioadmin
      IPA_S3_BUCKET: ipa-documents
      IPA_S3_SECURE: "false"
      IPA_SECRET_KEY: ci-secret-not-for-production
      NVIDIA_API_KEY: fake-key-providers-are-mocked
      NVIDIA_LLM_MODEL: fake/llm
      NVIDIA_VLM_MODEL: fake/vlm
      NVIDIA_EMBED_MODEL: fake/embed
      NVIDIA_EMBED_DIM: "1024"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: uv sync --all-extras --dev
      - run: uv run alembic upgrade head
      - name: pytest integration
        run: uv run pytest tests/integration -v --maxfail=1 --durations=15
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            .pytest_cache/
            logs/

  web:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.python == 'true'
        with:
          enable-cache: true
      - name: pip-audit
        if: needs.changes.outputs.python == 'true'
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --all-extras --dev
          uv run pip-audit --strict || true

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [docs, lint, unit, migrations, integration, web, docker, security]
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ join(needs.*.result, ",") }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI gate failed"; exit 1 ;;
            *) echo "CI gate passed" ;;
          esac
